name: Translate videos

# Runs every hour and translates anything new or changed (videos, quizzes, paths, toolbox talks,
# the announcement). It finishes in seconds when there is nothing to do.
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: data-writer
  cancel-in-progress: false

env:
  SUPABASE_URL: https://xzyzovlmlppvctbpxnrw.supabase.co
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  SKIP_IF_NO_KEY: "1"   # hourly: don't fail every hour before the secret is added

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Translate new or changed content
        id: tr
        run: node scripts/translate.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      - name: Continue in a new run if there is more to translate
        if: steps.tr.outputs.more == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run translate.yml --ref "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}"
